name: Windows-program

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Sorvégek változatlanul (a JUCE-javítás miatt)
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - name: WebView2 SDK letöltése (NuGet)
        shell: pwsh
        run: |
          $idx = Invoke-RestMethod https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/index.json
          $ver = ($idx.versions | Where-Object { $_ -notmatch '-' })[-1]
          Write-Host "WebView2 SDK: $ver"
          New-Item -ItemType Directory -Force -Path wv2 | Out-Null
          Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/$ver/microsoft.web.webview2.$ver.nupkg" -OutFile wv2.zip
          Expand-Archive wv2.zip -DestinationPath "wv2/Microsoft.Web.WebView2.$ver" -Force

      - name: CMake beállítás
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path naplo | Out-Null
          cmake --version
          cmake -S . -B build -A x64 "-DJUCE_WEBVIEW2_PACKAGE_LOCATION=$((Resolve-Path wv2).Path -replace '\\','/')" 2>&1 | Tee-Object -FilePath naplo/1-beallitas.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Fordítás
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2>&1 | Tee-Object -FilePath naplo/2-forditas.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Hordozható csomag
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse build -Filter Hangszonyeg.exe | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path dist/Hangszonyeg | Out-Null
          Copy-Item $exe.FullName dist/Hangszonyeg/
          Copy-Item installer/OLVASSEL.txt dist/Hangszonyeg/
          Compress-Archive -Path dist/Hangszonyeg/* -DestinationPath dist/Hangszonyeg-hordozhato.zip -Force

      - name: Telepítő (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc /O"dist" installer/hangszonyeg.iss

      - name: Próba-VST3 (a tesztekhez)
        continue-on-error: true
        shell: pwsh
        run: |
          $juce = (Resolve-Path build/_deps/juce-src).Path -replace '\\','/'
          cmake -S tests/testplugin -B build-tp -A x64 "-DJUCE_DIR=$juce" 2>&1 | Tee-Object -FilePath naplo/3-probaplugin.txt
          cmake --build build-tp --config Release --parallel 2>&1 | Tee-Object -Append -FilePath naplo/3-probaplugin.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Hangszonyeg-Windows
          path: |
            dist/Hangszonyeg-telepito.exe
            dist/Hangszonyeg-hordozhato.zip

      - name: Napló mentése a ci-naplo ágra (a hibakereséshez)
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path naplo)) { exit 0 }
          Copy-Item build/CMakeFiles/CMakeConfigureLog.yaml naplo/ -ErrorAction SilentlyContinue
          Copy-Item dist/Hangszonyeg/Hangszonyeg.exe naplo/ -ErrorAction SilentlyContinue
          $tp = Get-ChildItem -Recurse build-tp -Directory -Filter "HZ Teszt.vst3" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($tp) { Copy-Item -Recurse $tp.FullName naplo/ }
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          $msg = "Napló: ${{ github.sha }} (${{ job.status }})"
          git checkout --orphan ci-naplo-tmp
          git rm -rf --cached . | Out-Null
          git add -f naplo
          git commit -m $msg | Out-Null
          git push -f origin ci-naplo-tmp:ci-naplo

      - name: Kiadás (a legújabb változat a Releases oldalon)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'legujabb' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Hangszőnyeg {0}', github.ref_name) || 'Hangszőnyeg – legújabb változat' }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Windows-telepítő és hordozható változat.
            - **Hangszonyeg-telepito.exe**: telepítő (rendszergazdai jog nem kell).
            - **Hangszonyeg-hordozhato.zip**: kicsomagolás után a Hangszonyeg.exe indítható.
            Első indításkor a Windows figyelmeztethet, mert a program nincs aláírva: „További információ” → „Futtatás mindenképp”.
          files: |
            dist/Hangszonyeg-telepito.exe
            dist/Hangszonyeg-hordozhato.zip
